# Y-finder at /y-finder/ on app.researcharchitect.ai.
# Installed as /etc/nginx/snippets/yfinder.conf and included inside BOTH server blocks
# (80 and 443) of /etc/nginx/sites-available/causalai, before "location / {".
location = /y-finder { return 301 /y-finder/; }
location /y-finder/ {
    proxy_pass http://127.0.0.1:8060/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering    off;      # server-sent events stream token by token
    proxy_cache        off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 16M;
}
